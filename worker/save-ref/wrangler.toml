# Deploys to save-ref-rebuild.<your-subdomain>.workers.dev.
#
# NOT "save-ref-v2": bigbrain/worker already deploys under that name, and a
# deploy from here would REPLACE it — different code, a different KV binding,
# no cron, no Vectorize. That happened once (2026-09-18) and cost a live
# worker until it was redeployed from bigbrain/worker. Two configs must never
# claim one name; keep these distinct.
#
# This is the standalone rebuild. If you want it to BE the main one, migrate
# the data first (npm run migrate) and change the name deliberately.
name = "save-ref-rebuild"
main = "src/index.js"
compatibility_date = "2025-05-01"

# KV holds the refs (and uploaded blobs unless you add R2 below).
# Create it once, then paste the printed id:
#   npx wrangler kv namespace create save-ref-kv
[[kv_namespaces]]
binding = "REFS_KV"
id = "7cfbc919f17344668fc3ec871772e0f7"

# OPTIONAL — offload uploaded image/file bytes to R2 instead of KV (recommended
# if you drop lots of large files; KV values are capped at 25 MB). Create with:
#   npx wrangler r2 bucket create save-ref-blobs
# then uncomment:
# [[r2_buckets]]
# binding = "REFS_R2"
# bucket_name = "save-ref-blobs"

# AUTH_TOKEN is a secret, never committed. Set it with:
#   openssl rand -hex 32           # copy the output -> this is your Big Brain token
#   npx wrangler secret put AUTH_TOKEN
# Paste the SAME value into the /drop page's first-time setup field.
